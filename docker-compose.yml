version: "3.9"

services:
  api:
    build: .
    container_name: ipv6-monitor
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:///./data/ipv6_monitor.db
      SECRET_KEY: change-me-in-production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
